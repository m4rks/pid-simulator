<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pętla regulacji · Tick</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Pid.Domain · Simulation.Tick(dt)</p>
    <h1>Pętla regulacji w jednym kroku symulacji</h1>

    <div class="diagram-container">
    <svg viewBox="0 0 960 488" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="control-loop-title control-loop-desc">
      <title id="control-loop-title">Pętla regulacji w jednym kroku symulacji</title>
      <desc id="control-loop-desc">Zamknięta pętla Simulation.Tick: PidController porównuje temperaturę zadaną z pomiarem, Heater zamienia sygnał 0..1 na moc, HouseModel liczy nową temperaturę przy danej temperaturze otoczenia, a pomiar wraca do regulatora; każdy krok zwraca SimulationSample.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: Simulation aggregate (drawn before arrows and nodes) -->
      <rect x="24" y="24" width="856" height="296" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="40" y="28" width="132" height="12" rx="2" fill="#f5f5f5"/>
      <text x="106" y="37" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">SIMULATION · AGGREGATE</text>

      <!-- Arrows first (behind boxes) -->
      <!-- Setpoint -> PID -->
      <line x1="168" y1="200" x2="232" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- PID -> Heater -->
      <line x1="408" y1="200" x2="472" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Heater -> House -->
      <line x1="616" y1="200" x2="680" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Ambient -> House -->
      <line x1="768" y1="112" x2="768" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Feedback: House bottom -> PID bottom (focal) -->
      <path d="M 736,232 V 288 Q 736,296 728,296 H 328 Q 320,296 320,288 V 232"
            fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Tick returns a sample (dashed) -->
      <line x1="800" y1="232" x2="800" y2="344" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="420" y="180" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="440" y="189" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">U 0..1</text>

      <rect x="624" y="180" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="648" y="189" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POWER W</text>

      <rect x="496" y="276" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="544" y="285" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MEASURED T °C</text>

      <rect x="808" y="276" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="836" y="285" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PER TICK</text>

      <!-- Node: Setpoint (input) -->
      <rect x="40" y="168" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="168" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
      <rect x="48" y="176" width="24" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
      <text x="60" y="185" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
      <text x="104" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Setpoint</text>
      <text x="104" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SetpointC</text>

      <!-- Node: PidController (focal) -->
      <rect x="232" y="168" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="168" width="176" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <rect x="240" y="176" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
      <text x="256" y="185" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CTRL</text>
      <text x="320" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PidController</text>
      <text x="320" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Kp·Ki·Kd · anti-windup</text>

      <!-- Node: Heater -->
      <rect x="472" y="168" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="472" y="168" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="480" y="176" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="494" y="185" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACT</text>
      <text x="544" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Heater</text>
      <text x="544" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">u × MaxPowerW</text>

      <!-- Node: HouseModel -->
      <rect x="680" y="168" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="168" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="688" y="176" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="708" y="185" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLANT</text>
      <text x="768" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HouseModel</text>
      <text x="768" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">C·dT/dt = P − (T−Ta)/R</text>

      <!-- Node: Ambient (input / disturbance) -->
      <rect x="680" y="56" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="56" width="176" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
      <rect x="688" y="64" width="24" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
      <text x="700" y="73" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
      <text x="768" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ambient</text>
      <text x="768" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AmbientC · zakłócenie</text>

      <!-- Node: SimulationSample (store) -->
      <rect x="720" y="344" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="344" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="728" y="352" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="742" y="361" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
      <text x="800" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SimulationSample</text>
      <text x="800" y="390" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">t · T · u · PowerW</text>

      <!-- Editorial callout -->
      <text x="40" y="360" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Sygnał u liczony z bieżącego pomiaru</text>
      <text x="40" y="378" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">i trzymany stały przez cały krok dt.</text>

      <!-- Legend strip -->
      <line x1="40" y1="424" x2="920" y2="424" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="456" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="60" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Regulator (focal)</text>

      <rect x="168" y="456" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="188" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Piec / obiekt</text>

      <rect x="284" y="456" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
      <text x="304" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Wejście</text>

      <rect x="372" y="456" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="392" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Próbka (wynik)</text>

      <line x1="492" y1="462" x2="520" y2="462" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="528" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sygnał</text>

      <line x1="604" y1="462" x2="632" y2="462" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="640" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sprzężenie zwrotne</text>

      <line x1="752" y1="462" x2="780" y2="462" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="788" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Zwracane z Tick</text>
    </svg>
    </div>
  </div>
</body>
</html>
